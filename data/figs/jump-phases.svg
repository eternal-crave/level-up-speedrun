<svg viewBox="0 0 320 180" role="img" aria-label="Five phases of a jump along its arc: instant take-off, fast rise, optional double jump before the top, a fall quicker than the rise, and a landing that sticks"><title>The five phases of a jump</title>
<line class="s-line" x1="10" y1="140" x2="310" y2="140"/>
<path class="s-acc" d="M30,140 C60,40 120,26 150,28 C190,30 236,70 262,140"/>
<path d="M150,28 C190,30 236,70 262,140" stroke="var(--hot)" stroke-width="3" fill="none" stroke-dasharray="6 5"/>
<g class="f-card" stroke="var(--ink)" stroke-width="2"><circle cx="30" cy="140" r="10"/><circle cx="62" cy="80" r="10"/><circle cx="118" cy="32" r="10"/><circle cx="214" cy="62" r="10"/><circle cx="262" cy="140" r="10"/></g>
<g class="t-ink t-sm" text-anchor="middle"><text x="30" y="144">1</text><text x="62" y="84">2</text><text x="118" y="36">3</text><text x="214" y="66">4</text><text x="262" y="144">5</text></g>
<g class="t-sm"><text x="10" y="160">1 take-off: now</text><text x="10" y="174">2 rise: fast</text><text x="112" y="160">3 double jump?</text><text x="112" y="174">4 fall: faster</text><text x="222" y="160">5 land: stick</text></g>
<text x="230" y="102" class="t-hot t-sm">falls faster</text>
</svg>
