<svg viewBox="0 0 320 170" role="img" aria-label="Six cutscene types on a scale from most Hollywood to most game: FMV, animated, Flash, prerendered, puppet show, scripted event"><title>From Hollywood to playable</title>
<defs><linearGradient id="csg" x1="0" x2="1"><stop offset="0" stop-color="var(--gold)"/><stop offset="1" stop-color="var(--go)"/></linearGradient></defs>
<rect x="16" y="70" width="288" height="10" rx="5" fill="url(#csg)"/>
<g class="f-card" stroke="var(--ink)" stroke-width="2"><circle cx="24" cy="75" r="8"/><circle cx="78" cy="75" r="8"/><circle cx="132" cy="75" r="8"/><circle cx="186" cy="75" r="8"/><circle cx="240" cy="75" r="8"/><circle cx="296" cy="75" r="9"/></g>
<g class="t-ink t-sm" text-anchor="middle"><text x="24" y="54">FMV</text><text x="78" y="40">Animated</text><text x="132" y="54">Flash</text><text x="186" y="40">Prerendered</text><text x="240" y="54">Puppet</text><text x="292" y="40" class="t-go">Scripted</text></g>
<g class="t-sm" text-anchor="middle"><text x="24" y="104">real</text><text x="24" y="116">actors</text><text x="132" y="104">still</text><text x="132" y="116">images</text><text x="240" y="104">game</text><text x="240" y="116">models</text><text x="292" y="104">you keep</text><text x="292" y="116">control</text></g>
<text x="16" y="146" class="t-gold t-sm">← most Hollywood</text><text x="304" y="146" class="t-go t-sm" text-anchor="end">most game →</text>
<text x="160" y="164" text-anchor="middle" class="t-sm">watching ← · → playing</text>
</svg>
