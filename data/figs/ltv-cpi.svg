<svg viewBox="0 0 320 180" role="img" aria-label="If a new player costs 2 dollars and earns 1.50 over their lifetime, every player loses money; when lifetime value is 3 dollars, each player earns 1 dollar profit"><title>LTV must beat CPI</title>
<line class="s-line" x1="20" y1="140" x2="300" y2="140"/>
<text x="80" y="14" text-anchor="middle" class="t-hot">Losing money</text><text x="230" y="14" text-anchor="middle" class="t-go">Growing</text>
<rect x="40" y="60" width="34" height="80" rx="3" class="f-hot"/><rect x="88" y="80" width="34" height="60" rx="3" class="f-acc"/>
<rect x="190" y="60" width="34" height="80" rx="3" class="f-hot"/><rect x="238" y="40" width="34" height="100" rx="3" class="f-go"/>
<g class="t-ink t-sm" text-anchor="middle"><text x="57" y="54">$2.00</text><text x="105" y="74">$1.50</text><text x="207" y="54">$2.00</text><text x="255" y="34">$3.00</text></g>
<g class="t-sm" text-anchor="middle"><text x="57" y="156">CPI</text><text x="105" y="156">LTV</text><text x="207" y="156">CPI</text><text x="255" y="156">LTV</text></g>
<text x="160" y="174" text-anchor="middle" class="t-sm">CPI = cost to get a player · LTV = what they earn you</text>
</svg>
