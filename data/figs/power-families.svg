<svg viewBox="0 0 320 196" role="img" aria-label="Four families of power-ups: defensive keeps you alive, offensive helps you fight, movement changes how you move, game changers change the rules"><title>The four power-up families</title>
<rect x="8" y="8" width="148" height="86" rx="10" class="f-go-soft"/><rect x="164" y="8" width="148" height="86" rx="10" class="f-hot-soft"/>
<rect x="8" y="102" width="148" height="86" rx="10" class="f-acc-soft"/><rect x="164" y="102" width="148" height="86" rx="10" class="f-gold-soft"/>
<g font-size="22" text-anchor="middle"><text x="34" y="44">🛡️</text><text x="190" y="44">⚔️</text><text x="34" y="138">🪽</text><text x="190" y="138">🧲</text></g>
<text x="54" y="34" class="t-go">Defensive</text><text x="54" y="50" class="t-sm">keep you alive</text><text x="20" y="80" class="t-sm">shields, extra lives</text>
<text x="210" y="34" class="t-hot">Offensive</text><text x="210" y="50" class="t-sm">fight better</text><text x="176" y="80" class="t-sm">fire, ice, helpers</text>
<text x="54" y="128" class="t-acc">Movement</text><text x="54" y="144" class="t-sm">move in new ways</text><text x="20" y="174" class="t-sm">jetpack, speed</text>
<text x="210" y="128" class="t-gold">Game changer</text><text x="210" y="144" class="t-sm">bend the rules</text><text x="176" y="174" class="t-sm">magnet, 2x coins</text>
</svg>
