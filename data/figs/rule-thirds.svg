<svg viewBox="0 0 320 190" role="img" aria-label="A frame split into thirds; the hero stands where two third-lines cross, not in the centre"><title>Rule of thirds</title>
<rect x="40" y="12" width="240" height="150" rx="6" class="s-ink"/>
<g stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="5 4"><line x1="120" y1="12" x2="120" y2="162"/><line x1="200" y1="12" x2="200" y2="162"/><line x1="40" y1="62" x2="280" y2="62"/><line x1="40" y1="112" x2="280" y2="112"/></g>
<circle cx="120" cy="62" r="4" class="f-line"/><circle cx="200" cy="62" r="4" class="f-line"/><circle cx="120" cy="112" r="4" class="f-line"/>
<circle cx="200" cy="112" r="15" class="f-acc"/><text x="200" y="117" text-anchor="middle" font-size="14">🗡️</text>
<text x="160" y="182" text-anchor="middle" class="t-sm">subject where lines cross, not dead centre</text>
</svg>
