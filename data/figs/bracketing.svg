<g fill="var(--ink-3)"><rect x="34" y="26" width="92" height="22"/><rect x="34" y="48" width="18" height="104"/><rect x="108" y="48" width="18" height="104"/><rect x="34" y="152" width="92" height="22"/></g>
<rect x="52" y="48" width="56" height="104" class="f-acc-soft"/><text x="80" y="104" text-anchor="middle" class="t-sm">game</text>
<rect x="190" y="20" width="100" height="160" rx="12" class="s-ink"/>
<rect x="194" y="26" width="92" height="148" class="f-acc-soft"/><rect x="194" y="26" width="92" height="12" fill="var(--ink-3)"/>
<circle cx="268" cy="156" r="12" class="f-acc"/><circle cx="242" cy="160" r="8" class="f-acc"/>
<text x="240" y="98" text-anchor="middle" class="t-sm">the action</text>
