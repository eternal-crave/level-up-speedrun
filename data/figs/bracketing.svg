<svg viewBox="0 0 320 200" role="img" aria-label="Two phone screens: on the left, panels on every edge squeeze the game into a mail slot; on the right, a small top bar and thumb-zone buttons leave the centre for the action"><title>Bracketing vs a clean screen</title>
