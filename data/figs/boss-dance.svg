<svg viewBox="0 0 320 196" role="img" aria-label="Boss pattern loop: primary attack, invulnerable attack, vulnerable state, player opportunity, repeating faster each phase; a health bar with three phase markers"><title>The boss dance (PIVO)</title>
<g class="f-card" stroke="var(--ink)" stroke-width="1.5"><rect x="110" y="8" width="100" height="30" rx="8"/><rect x="216" y="58" width="96" height="30" rx="8"/><rect x="110" y="108" width="100" height="30" rx="8"/><rect x="8" y="58" width="96" height="30" rx="8"/></g>
<rect x="110" y="108" width="100" height="30" rx="8" class="f-go-soft"/><rect x="8" y="58" width="96" height="30" rx="8" class="f-go-soft"/>
<g text-anchor="middle" class="t-sm"><text x="160" y="27" class="t-ink">P · primary</text><text x="264" y="77" class="t-ink">I · invulnerable</text><text x="160" y="127" class="t-go">V · vulnerable</text><text x="56" y="77" class="t-go">O · your hit</text></g>
<path class="s-ink" d="M212,30 Q250,32 258,54 M258,92 Q250,118 214,122 M108,122 Q66,118 58,92 M58,54 Q66,30 106,26"/>
