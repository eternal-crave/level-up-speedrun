<g stroke="var(--card)" stroke-width="3"><line x1="113" y1="158" x2="113" y2="176"/><line x1="207" y1="158" x2="207" y2="176"/></g>
<text x="20" y="190" class="t-sm">boss health bar with phase markers</text>
</svg>
