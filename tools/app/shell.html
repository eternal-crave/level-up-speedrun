<script>
// Startup guard: until the app finishes booting, any script error replaces the loading screen with the message and a Refresh button
window.__bootErr = function (msg) {
  var b = document.getElementById("boot"); if (!b) return;
  b.hidden = false; b.className = "err";
  b.querySelector(".boot-msg").textContent = "Something broke while starting: " + msg + ". Try Refresh. If it keeps happening, send a screenshot of this.";
  document.getElementById("boot-retry").hidden = false;
};
window.addEventListener("error", function (e) { if (!window.__booted) window.__bootErr(e.message || "unknown error"); });
</script>
